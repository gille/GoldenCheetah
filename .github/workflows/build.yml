name: Build GoldenCheetah

on:
  push:
    branches: [ master, '*' ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ master ]
# This cancels previous runs when a new push happens
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GC_VERSION: "3.8"
  PYTHON_VERSION: "3.11"
  MACOSX_DEPLOYMENT_TARGET: "12.0"

  # Secrets
  GC_GOOGLE_CALENDAR_CLIENT_SECRET: ${{ secrets.GC_GOOGLE_CALENDAR_CLIENT_SECRET || '\\\"development_key\\\"' }}
  GC_GOOGLE_DRIVE_CLIENT_ID: ${{ secrets.GC_GOOGLE_DRIVE_CLIENT_ID || '\\\"development_key\\\"' }}
  GC_GOOGLE_DRIVE_CLIENT_SECRET: ${{ secrets.GC_GOOGLE_DRIVE_CLIENT_SECRET || '\\\"development_key\\\"' }}
  GC_GOOGLE_DRIVE_API_KEY: ${{ secrets.GC_GOOGLE_DRIVE_API_KEY || '\\\"development_key\\\"' }}
  GC_CLOUD_OPENDATA_SECRET: ${{ secrets.GC_CLOUD_OPENDATA_SECRET || '\\\"development_key\\\"' }}
  GC_WITHINGS_CONSUMER_SECRET: ${{ secrets.GC_WITHINGS_CONSUMER_SECRET || '\\\"development_key\\\"' }}
  GC_NOKIA_CLIENT_SECRET: ${{ secrets.GC_NOKIA_CLIENT_SECRET || '\\\"development_key\\\"' }}
  GC_DROPBOX_CLIENT_SECRET: ${{ secrets.GC_DROPBOX_CLIENT_SECRET || '\\\"development_key\\\"' }}
  GC_STRAVA_CLIENT_SECRET: ${{ secrets.GC_STRAVA_CLIENT_SECRET || '\\\"development_key\\\"' }}
  GC_CYCLINGANALYTICS_CLIENT_SECRET: ${{ secrets.GC_CYCLINGANALYTICS_CLIENT_SECRET || '\\\"development_key\\\"' }}
  GC_CLOUD_DB_BASIC_AUTH: ${{ secrets.GC_CLOUD_DB_BASIC_AUTH || '\\\"development_key\\\"' }}
  GC_CLOUD_DB_APP_NAME: ${{ secrets.GC_CLOUD_DB_APP_NAME || '\\\"development_key\\\"' }}
  GC_POLARFLOW_CLIENT_SECRET: ${{ secrets.GC_POLARFLOW_CLIENT_SECRET || '\\\"development_key\\\"' }}
  GC_SPORTTRACKS_CLIENT_SECRET: ${{ secrets.GC_SPORTTRACKS_CLIENT_SECRET || '\\\"development_key\\\"' }}
  GC_RWGPS_API_KEY: ${{ secrets.GC_RWGPS_API_KEY || '\\\"development_key\\\"' }}
  GC_NOLIO_CLIENT_ID: ${{ secrets.GC_NOLIO_CLIENT_ID || '\\\"development_key\\\"' }}
  GC_NOLIO_SECRET: ${{ secrets.GC_NOLIO_SECRET || '\\\"development_key\\\"' }}
  GC_XERT_CLIENT_SECRET: ${{ secrets.GC_XERT_CLIENT_SECRET || '\\\"development_key\\\"' }}
  GC_AZUM_CLIENT_SECRET: ${{ secrets.GC_AZUM_CLIENT_SECRET || '\\\"development_key\\\"' }}
  GC_TRAINERDAY_API_KEY: ${{ secrets.GC_TRAINERDAY_API_KEY || '\\\"development_key\\\"' }}

jobs:
  build:
    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}
    strategy:
      fail-fast: false
      matrix:
        config:
          - {
              name: "Windows MSVC",
              os: windows-2022,
              qt_version: "6.8.1",
              qt_arch: win64_msvc2022_64,
              shell: "pwsh"
            }
          - {
              name: "Ubuntu 24.04",
              os: ubuntu-24.04,
              qt_version: "6.8.1",
              qt_arch: linux_gcc_64,
              shell: "bash"
            }
          - {
              name: "macOS Intel",
              os: macos-15,
              qt_version: "6.5.3",
              qt_arch: clang_64,
              shell: "bash"
            }
          - {
              name: "macOS ARM",
              os: macos-14,
              qt_version: "6.5.3",
              qt_arch: clang_64,
              shell: "bash"
            }
          - {
              name: "macOS Universal",
              os: macos-14,
              qt_version: "6.5.3",
              qt_arch: clang_64,
              shell: "bash"
            }

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Qt
        uses: jurplel/install-qt-action@v3
        with:
          version: ${{ matrix.config.qt_version }}
          arch: ${{ matrix.config.qt_arch }}
          cache: true
          modules: 'qtwebengine qtcharts qtserialport qtmultimedia qtconnectivity qtwebchannel qtpositioning qt5compat'

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # Caching - Windows Dependencies (Restore)
      - name: Restore Windows Libs
        if: runner.os == 'Windows'
        id: cache-windows-restore
        uses: actions/cache/restore@v3
        with:
          path: |
            C:\libs
            C:\jom
            C:\R
            C:\Python
          key: ${{ runner.os }}-libs-${{ hashFiles('github/windows/install.ps1') }}
          restore-keys: |
            ${{ runner.os }}-libs-

      # Caching - macOS Dependencies
      - name: Cache macOS Libs
        if: runner.os == 'macOS'
        uses: actions/cache@v3
        with:
          path: |
            d2xx
            srmio
          key: ${{ runner.os }}-libs-${{ hashFiles('github/macos/install.sh') }}
          restore-keys: |
            ${{ runner.os }}-libs-

      # Caching - CCache for Linux/macOS
      - name: Setup CCache
        if: runner.os != 'Windows'
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ runner.os }}-${{ matrix.config.qt_version }}

      # Caching - MacPorts (Universal Build) - Restore
      - name: Restore MacPorts
        if: matrix.config.name == 'macOS Universal'
        id: cache-macports-restore
        uses: actions/cache/restore@v3
        with:
          path: |
            /opt/local
            libical-install
            srmio-install
            D2XX
            R-Universal
          key: ${{ runner.os }}-macports-${{ hashFiles('github/macos/macports_requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-macports-

      - name: Fix MacPorts Permissions
        if: matrix.config.name == 'macOS Universal'
        run: |
          if [ -d "/opt/local" ]; then
            echo "Fixing MacPorts permissions..."
            sudo chown -R root:admin /opt/local
          fi

      - name: Install Dependencies (Windows)
        if: runner.os == 'Windows'
        id: install-windows
        run: github/windows/install.ps1

      - name: Save Windows Libs
        if: runner.os == 'Windows' && steps.install-windows.outcome == 'success' && steps.cache-windows-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v3
        with:
          path: |
            C:\libs
            C:\jom
            C:\R
            C:\Python
          key: ${{ runner.os }}-libs-${{ hashFiles('github/windows/install.ps1') }}

      - name: Install Dependencies (Linux)
        if: runner.os == 'Linux'
        run: bash github/linux/install.sh

      - name: Install Dependencies (macOS Homebrew)
        if: runner.os == 'macOS' && matrix.config.name != 'macOS Universal'
        run: bash github/macos/install.sh

      - name: Install Dependencies (macOS MacPorts)
        if: matrix.config.name == 'macOS Universal'
        id: install-macports
        run: bash github/macos/install_macports.sh

      - name: Save MacPorts
        if: matrix.config.name == 'macOS Universal' && steps.install-macports.outcome == 'success' && steps.cache-macports-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v3
        with:
          path: |
            /opt/local
            libical-install
            srmio-install
            D2XX
            R-Universal
          key: ${{ runner.os }}-macports-${{ hashFiles('github/macos/macports_requirements.txt') }}

      - name: Setup MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        run: github/windows/before_build.ps1

      - name: Configure (Linux)
        if: runner.os == 'Linux'
        run: bash github/linux/before_build.sh

      - name: Configure (macOS Homebrew)
        if: runner.os == 'macOS' && matrix.config.name != 'macOS Universal'
        run: bash github/macos/before_build.sh

      - name: Configure (macOS MacPorts)
        if: matrix.config.name == 'macOS Universal'
        run: bash github/macos/before_build_macports.sh

      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: |
          qmake build.pro -r -spec win32-msvc
          # Windows might fail QWT in parallel due to races.
          # Try parallel first (-j -k), fallback to single thread (-j1) if it fails.
          jom -k sub-qwt || jom -j1 sub-qwt
          # Build main source jom autodetects number of cores.
          jom

      - name: Prepend CCache to PATH (Unix)
        if: runner.os != 'Windows'
        run: echo "/usr/lib/ccache:/usr/local/opt/ccache/libexec" >> $GITHUB_PATH

      - name: Build (Unix)
        if: runner.os != 'Windows'
        run: |
          # Ensure QMake uses ccache
          
          if [ "$(uname)" == "Darwin" ]; then
             # On macOS, ccache wraps clang usually
             # Force Universal Build properties
             if [ "${{ matrix.config.name }}" == "macOS Universal" ]; then
                qmake build.pro -r "QMAKE_CXX=ccache clang++" "QMAKE_CC=ccache clang" "QMAKE_APPLE_DEVICE_ARCHS=x86_64 arm64"
             else
                qmake build.pro -r "QMAKE_CXX=ccache clang++" "QMAKE_CC=ccache clang"
             fi
             CORES=$(sysctl -n hw.ncpu)
          else
             qmake build.pro -r "QMAKE_CXX=ccache g++" "QMAKE_CC=ccache gcc"
             CORES=$(nproc)
          fi          
          echo "Building with $CORES cores"
          make -j$CORES sub-qwt
          make -j$CORES

      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: github/windows/after_build.ps1

      - name: Package (Linux)
        if: runner.os == 'Linux'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash github/linux/after_build.sh

      - name: Package (macOS Homebrew)
        if: runner.os == 'macOS' && matrix.config.name != 'macOS Universal'
        run: bash github/macos/after_build.sh

      - name: Package (macOS MacPorts)
        if: matrix.config.name == 'macOS Universal'
        run: bash github/macos/after_build_macports.sh

      - name: Upload Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GoldenCheetah-${{ matrix.config.name }}
          path: |
            GoldenCheetah*.dmg
            GoldenCheetah*.AppImage
            GoldenCheetah*.exe
            GCversion*.txt
